<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Four questions before approving an AI use</title><desc id="desc">Define the intended task, identify the data, assign human review, and record the approval boundary.</desc><rect width="640" height="420" fill="#101922"/><g fill="none" stroke="#46515a"><rect x="20" y="20" width="290" height="180"/><rect x="330" y="20" width="290" height="180"/><rect x="20" y="220" width="290" height="180"/><rect x="330" y="220" width="290" height="180"/></g><g font-family="Arial,sans-serif" font-size="26" fill="#d5b57c"><text x="42" y="66">01 / INTENDED USE</text><text x="352" y="66">02 / INFORMATION</text><text x="42" y="266">03 / OVERSIGHT</text><text x="352" y="266">04 / APPROVAL</text></g><g font-family="Georgia,serif" font-size="33" fill="#f4f0e7"><text x="42" y="118">What may the</text><text x="42" y="158">system do?</text><text x="352" y="118">What data may</text><text x="352" y="158">it receive?</text><text x="42" y="318">Who checks</text><text x="42" y="358">the output?</text><text x="352" y="318">What changes</text><text x="352" y="358">require review?</text></g></svg>
