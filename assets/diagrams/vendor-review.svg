<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Four parts of an AI vendor review</title><desc id="desc">Compare the vendor's promise, the controlling contract, the supporting evidence, and the decision the business can make.</desc><rect width="640" height="420" fill="#101922"/><g fill="none" stroke="#46515a"><rect x="20" y="20" width="290" height="180"/><rect x="330" y="20" width="290" height="180"/><rect x="20" y="220" width="290" height="180"/><rect x="330" y="220" width="290" height="180"/></g><g font-family="Arial,sans-serif" font-size="26" fill="#d5b57c"><text x="42" y="66">01 / THE PROMISE</text><text x="352" y="66">02 / THE CONTRACT</text><text x="42" y="266">03 / THE EVIDENCE</text><text x="352" y="266">04 / THE DECISION</text></g><g font-family="Georgia,serif" font-size="33" fill="#f4f0e7"><text x="42" y="118">What does the</text><text x="42" y="158">provider say?</text><text x="352" y="118">What does it</text><text x="352" y="158">commit to?</text><text x="42" y="318">What supports</text><text x="42" y="358">that assurance?</text><text x="352" y="318">Which uses can</text><text x="352" y="358">we approve?</text></g></svg>
